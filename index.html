<!DOCTYPE html>
<html lang="en">

<head>
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Game</title>
</head>

<body>
    <h2 id="main">Wordle Game</h2>
    <hr>
                    <h2 id="level">Level : 1</h2> 

                <h3 id="Hint">Hint :</h3>
                                <p id="Score" class="score">Score : 0</p> 


        <section class="board">
        <div class="row">
            <p class="sqr" id="0"></p>
            <p class="sqr" id="1"></p>
            <p class="sqr" id="2"></p>
            <p class="sqr" id="3"></p>
            <p class="sqr" id="4"></p>
        </div>
        <div class="row">
            <p class="sqr" id="5"></p>
            <p class="sqr" id="6"></p>
            <p class="sqr" id="7"></p>
            <p class="sqr" id="8"></p>
            <p class="sqr" id="9"></p>

        </div>
        <div class="row">
            <p class="sqr" id="10"></p>
            <p class="sqr" id="11"></p>
            <p class="sqr" id="12"></p>
            <p class="sqr" id="13"></p>
            <p class="sqr" id="14"></p>

        </div>
        <div class="row">
            <p class="sqr" id="15"></p>
            <p class="sqr" id="16"></p>
            <p class="sqr" id="17"></p>
            <p class="sqr" id="18"></p>
            <p class="sqr" id="19"></p>

        </div>
        <div class="row">
            <p class="sqr" id="20"></p>
            <p class="sqr" id="21"></p>
            <p class="sqr" id="22"></p>
            <p class="sqr" id="23"></p>
            <p class="sqr" id="24"></p>
        </div>
        <div class="row">
            <p class="sqr" id="25"></p>
            <p class="sqr" id="26"></p>
            <p class="sqr" id="27"></p>
            <p class="sqr" id="28"></p>
            <p class="sqr" id="29"></p>
        </div>
        <div class="keyboard">
            <div class="key-row">
                <button class="key" id="Q">Q</button>
                <button class="key" id="W">W</button>
                <button class="key" id="E">E</button>
                <button class="key" id="R">R</button>
                <button class="key" id="T">T</button>
                <button class="key" id="Y">Y</button>
                <button class="key" id="U">U</button>
                <button class="key" id="I">I</button>
                <button class="key" id="O">O</button>
                <button class="key" id="P">P</button>
            </div>
            <div class="key-row">
                <button class="key" id="A">A</button>
                <button class="key" id="S">S</button>
                <button class="key" id="D">D</button>
                <button class="key" id="F">F</button>
                <button class="key" id="G">G</button>
                <button class="key" id="H">H</button>
                <button class="key" id="J">J</button>
                <button class="key" id="K">K</button>
                <button class="key" id="L">L</button>
            </div>
            <div class="key-row">
                <button class="key wide" id="Backspace">Backspace</button>

                <button class="key" id="Z">Z</button>
                <button class="key" id="X">X</button>
                <button class="key" id="C">C</button>
                <button class="key" id="V">V</button>
                <button class="key" id="B">B</button>
                <button class="key" id="N">N</button>
                <button class="key" id="M">M</button>
                <button class="key wide" id="Enter">ENTER</button>

                <div>
                </div>
    </section>


<section class="game-over">
                <button class="try hidden" id="try">Try Again</button>
</section>

</body>

</html>
